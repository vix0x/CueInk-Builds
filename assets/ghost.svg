<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>

  <defs>

    <!-- ================================================== -->
    <!-- GHOST BODY LIGHTING                                -->
    <!-- ================================================== -->

    <linearGradient
      id="ghostBody"
      x1="0"
      y1="0"
      x2="0.15"
      y2="1"
    >
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="28%"  stop-color="#FFFFFF"/>
      <stop offset="65%"  stop-color="#F8FBFF"/>
      <stop offset="88%"  stop-color="#EEF5FD"/>
      <stop offset="100%" stop-color="#E4EFFB"/>
    </linearGradient>


    <!-- Subtle vertical blue reflection -->
    <linearGradient
      id="blueReflection"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="48%"  stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="58%"  stop-color="#FFFFFF" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>


    <!-- ================================================== -->
    <!-- INNER BLUE RIM                                      -->
    <!-- ================================================== -->

    <linearGradient
      id="innerBlue"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop offset="0%"   stop-color="#2998EC"/>
      <stop offset="40%"  stop-color="#147DD5"/>
      <stop offset="100%" stop-color="#0869C3"/>
    </linearGradient>


    <!-- ================================================== -->
    <!-- EYE GRADIENT                                        -->
    <!-- ================================================== -->

    <linearGradient
      id="eyeBlue"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop offset="0%"   stop-color="#1785DF"/>
      <stop offset="100%" stop-color="#0867BE"/>
    </linearGradient>


    <!-- ================================================== -->
    <!-- OUTER WHITE GLOW                                    -->
    <!-- ================================================== -->

    <filter
      id="outerGlow"
      x="-80%"
      y="-80%"
      width="260%"
      height="260%"
    >
      <feGaussianBlur
        stdDeviation="7"
        result="blur1"
      />

      <feGaussianBlur
        in="SourceGraphic"
        stdDeviation="1.5"
        result="blur2"
      />

      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


    <!-- Stronger soft halo -->
    <filter
      id="halo"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur
        stdDeviation="15"
      />
    </filter>


    <!-- ================================================== -->
    <!-- VERY SOFT BODY SHADOW                               -->
    <!-- ================================================== -->

    <filter
      id="softShadow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="4"
      />
    </filter>


    <!-- ================================================== -->
    <!-- HIGHLIGHT MASK                                      -->
    <!-- ================================================== -->

    <linearGradient
      id="highlight"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".75"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

  </defs>



  <!-- ==================================================== -->
  <!-- FLOATING ATMOSPHERIC HALO                            -->
  <!-- ==================================================== -->

  <ellipse
    cx="256"
    cy="392"
    rx="112"
    ry="22"
    fill="#FFFFFF"
    opacity=".12"
    filter="url(#halo)"
  />



  <!-- ==================================================== -->
  <!-- OUTER GHOST SILHOUETTE / GLOW                        -->
  <!-- ==================================================== -->

  <path
    d="
      M256 47

      C207 47 163 65 131 97
      C98 130 79 174 79 222

      C79 259 91 292 111 318

      C122 332 136 344 151 354

      C151 370 156 386 165 398

      C175 411 189 418 205 418

      C221 418 235 411 247 398

      C250 403 253 408 256 412

      C259 408 262 403 265 398

      C277 411 291 418 307 418

      C323 418 337 411 347 398

      C356 386 361 370 361 354

      C376 344 390 332 401 318

      C421 292 433 259 433 222

      C433 174 414 130 381 97

      C349 65 305 47 256 47

      Z
    "

    fill="#FFFFFF"
    opacity=".42"
    filter="url(#halo)"
  />



  <!-- ==================================================== -->
  <!-- MAIN OUTER WHITE BODY                                -->
  <!-- ==================================================== -->

  <path
    id="ghostOuter"
    d="
      M256 49

      C208 49 166 66 134 97

      C101 128 84 172 84 219

      C84 257 96 289 116 315

      C126 328 139 339 154 349

      C153 365 157 381 166 393

      C176 406 190 413 205 413

      C222 413 235 404 246 388

      C250 396 253 403 256 408

      C259 403 262 396 266 388

      C277 404 290 413 307 413

      C322 413 336 406 346 393

      C355 381 359 365 358 349

      C373 339 386 328 396 315

      C416 289 428 257 428 219

      C428 172 411 128 378 97

      C346 66 304 49 256 49

      Z
    "

    fill="none"
    stroke="#FFFFFF"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#outerGlow)"
  />



  <!-- ==================================================== -->
  <!-- MAIN GHOST BODY                                      -->
  <!-- ==================================================== -->

  <path
    d="
      M256 56

      C211 56 171 72 141 102

      C110 132 94 173 94 218

      C94 252 104 282 123 307

      C133 321 146 333 160 342

      C159 358 163 373 171 384

      C179 395 191 401 204 401

      C220 401 233 391 243 375

      C248 385 252 393 256 399

      C260 393 264 385 269 375

      C279 391 292 401 308 401

      C321 401 333 395 341 384

      C349 373 353 358 352 342

      C366 333 379 321 389 307

      C408 282 418 252 418 218

      C418 173 402 132 371 102

      C341 72 301 56 256 56

      Z
    "

    fill="url(#ghostBody)"
    stroke="#FFFFFF"
    stroke-width="10"
    stroke-linejoin="round"
  />



  <!-- ==================================================== -->
  <!-- BLUE INNER RECESSED BORDER                           -->
  <!-- ==================================================== -->

  <path
    d="
      M256 76

      C218 76 183 90 157 116

      C130 142 116 178 116 217

      C116 246 124 272 140 294

      C149 306 160 316 172 324

      C171 338 174 350 181 359

      C187 368 197 373 207 373

      C220 373 231 365 240 351

      C246 362 251 370 256 377

      C261 370 266 362 272 351

      C281 365 292 373 305 373

      C315 373 325 368 331 359

      C338 350 341 338 340 324

      C352 316 363 306 372 294

      C388 272 396 246 396 217

      C396 178 382 142 355 116

      C329 90 294 76 256 76

      Z
    "

    fill="none"
    stroke="url(#innerBlue)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />



  <!-- ==================================================== -->
  <!-- INNER BLUE SHADOW / DEPTH                             -->
  <!-- ==================================================== -->

  <path
    d="
      M173 322

      C171 339 175 351 182 360

      C188 368 197 373 208 373

      C221 373 232 365 241 351

      C246 362 251 371 256 377

      C261 371 266 362 271 351

      C280 365 291 373 304 373

      C315 373 324 368 330 360

      C337 351 341 339 339 322
    "

    fill="none"
    stroke="#0B6FC9"
    stroke-width="5"
    stroke-linecap="round"
    opacity=".7"
  />



  <!-- ==================================================== -->
  <!-- LEFT SIDE BODY REFLECTION                             -->
  <!-- ==================================================== -->

  <path
    d="
      M150 119

      C123 148 110 182 110 218

      C110 257 124 287 148 311

      C158 321 169 329 181 336
    "

    fill="none"
    stroke="#FFFFFF"
    stroke-width="8"
    stroke-linecap="round"
    opacity=".42"
  />



  <!-- ==================================================== -->
  <!-- TOP BODY HIGHLIGHT                                    -->
  <!-- ==================================================== -->

  <path
    d="
      M180 101

      C202 79 228 68 257 68

      C286 68 313 79 334 97
    "

    fill="none"
    stroke="#FFFFFF"
    stroke-width="7"
    stroke-linecap="round"
    opacity=".55"
  />



  <!-- ==================================================== -->
  <!-- SUBTLE BODY LIGHT BAND                                -->
  <!-- ==================================================== -->

  <path
    d="
      M148 157

      C168 113 208 88 256 88

      C304 88 344 113 364 157
    "

    fill="none"
    stroke="url(#highlight)"
    stroke-width="16"
    stroke-linecap="round"
    opacity=".25"
  />



  <!-- ==================================================== -->
  <!-- LEFT MEAN EYE                                        -->
  <!-- ==================================================== -->

  <path
    d="
      M151 188

      C170 199 190 211 216 220

      C205 232 190 238 174 238

      C159 238 148 231 144 219

      C140 208 141 197 145 190

      C147 187 149 187 151 188

      Z
    "

    fill="url(#eyeBlue)"
  />



  <!-- ==================================================== -->
  <!-- RIGHT MEAN EYE                                       -->
  <!-- ==================================================== -->

  <path
    d="
      M361 188

      C342 199 322 211 296 220

      C307 232 322 238 338 238

      C353 238 364 231 368 219

      C372 208 371 197 367 190

      C365 187 363 187 361 188

      Z
    "

    fill="url(#eyeBlue)"
  />



  <!-- ==================================================== -->
  <!-- EYE UPPER SHADOW                                     -->
  <!-- ==================================================== -->

  <path
    d="
      M151 189
      C171 201 191 211 216 219

      M361 189
      C341 201 321 211 296 219
    "

    fill="none"
    stroke="#49AEF1"
    stroke-width="3"
    stroke-linecap="round"
    opacity=".55"
  />



  <!-- ==================================================== -->
  <!-- EYE LOWER DEPTH                                      -->
  <!-- ==================================================== -->

  <path
    d="
      M146 218
      C153 229 163 234 175 234

      M366 218
      C359 229 349 234 337 234
    "

    fill="none"
    stroke="#075EAE"
    stroke-width="3"
    stroke-linecap="round"
    opacity=".55"
  />



  <!-- ==================================================== -->
  <!-- VERY SUBTLE FLOATING MOTION GLOW                     -->
  <!-- ==================================================== -->

  <path
    d="
      M190 421
      C214 430 236 433 256 433
      C276 433 298 430 322 421
    "

    fill="none"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-linecap="round"
    opacity=".16"
    filter="url(#softShadow)"
  />

</svg>
